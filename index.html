<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유광 포토카드</title>
<style>
html,body{margin:0;height:100%;background:#1e120c;overflow:hidden}
body{background-image:radial-gradient(ellipse 85% 65% at 45% 35%,#4a3022 0%,#1e120c 100%)}
.stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}
.stage.live video{display:block}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
</style>
</head>
<body>
<main class="stage" id="stage"><video id="cam" playsinline muted></video></main>

<input type="file" id="frontInput" accept="image/*" aria-label="앞면 사진">
<input type="file" id="backInput" accept="image/*" aria-label="뒷면 사진">

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch(e){
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.physicallyCorrectLights = true;
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('role', 'button');
  renderer.domElement.setAttribute('aria-label', '포토카드. 드래그로 기울이고 탭하거나 Enter로 뒤집기');
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

  // ---------- studio environment: one large softbox in a warm dark room
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  const basic = (r,g,b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r,g,b), side: THREE.DoubleSide });
  const room = new THREE.Mesh(new THREE.BoxGeometry(30,30,30), basic(0.03,0.018,0.012));
  room.material.side = THREE.BackSide; env.add(room);
  const softbox = new THREE.Mesh(new THREE.CircleGeometry(0.36, 64), basic(260,248,225));
  softbox.position.set(-2.2, 2.6, 7.5); softbox.lookAt(0,0,0); env.add(softbox);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(9,6.5), basic(0.22,0.21,0.2));
  halo.position.copy(softbox.position).multiplyScalar(1.03); halo.lookAt(0,0,0); env.add(halo);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(30,30), basic(0.32,0.18,0.1));
  table.position.set(0,-7,0); table.rotation.x = -Math.PI/2; env.add(table);
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(5,5), basic(0.18,0.18,0.2));
  fill.position.set(7,-1,3); fill.lookAt(0,0,0); env.add(fill);
  let envRT = null;
  function rebuildEnv(){
    const rt = pmrem.fromScene(env, 0.015);
    scene.environment = rt.texture;
    if(envRT) envRT.dispose();
    envRT = rt;
  }
  rebuildEnv();

  // ---------- orange-peel laminate normal map (tileable)
  function orangePeel(n){
    let a = new Float32Array(n*n), t = new Float32Array(n*n);
    for(let i=0;i<a.length;i++) a[i] = Math.random();
    const r = 2, d = 2*r+1;
    for(let pass=0; pass<4; pass++){
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let s=0; for(let k=-r;k<=r;k++) s+=a[y*n+((x+k+n)%n)]; t[y*n+x]=s/d; }
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let s=0; for(let k=-r;k<=r;k++) s+=t[((y+k+n)%n)*n+x]; a[y*n+x]=s/d; }
    }
    let mn=Infinity,mx=-Infinity; for(const v of a){ if(v<mn)mn=v; if(v>mx)mx=v; }
    const c = document.createElement('canvas'); c.width=c.height=n;
    const ctx = c.getContext('2d'), img = ctx.createImageData(n,n), S = 2.5;
    const h = (x,y) => (a[((y+n)%n)*n+((x+n)%n)]-mn)/(mx-mn);
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const dx=(h(x+1,y)-h(x-1,y))*S, dy=(h(x,y+1)-h(x,y-1))*S;
      const l=Math.hypot(dx,dy,1), i=(y*n+x)*4;
      img.data[i]=(-dx/l*.5+.5)*255; img.data[i+1]=(dy/l*.5+.5)*255; img.data[i+2]=(1/l*.5+.5)*255; img.data[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // ---------- card geometry (55 x 85 mm, rounded corners, real thickness)
  const W = 2.2, H = 3.4, T = 0.012, R = 0.22;
  const shape = new THREE.Shape(); const x0=-W/2, y0=-H/2;
  shape.moveTo(x0+R,y0); shape.lineTo(x0+W-R,y0); shape.absarc(x0+W-R,y0+R,R,-Math.PI/2,0,false);
  shape.lineTo(x0+W,y0+H-R); shape.absarc(x0+W-R,y0+H-R,R,0,Math.PI/2,false);
  shape.lineTo(x0+R,y0+H); shape.absarc(x0+R,y0+H-R,R,Math.PI/2,Math.PI,false);
  shape.lineTo(x0,y0+R); shape.absarc(x0+R,y0+R,R,Math.PI,1.5*Math.PI,false);

  // clean outline of the rounded rectangle (points with outward normals)
  const outline = (() => {
    const N = 480, pts = shape.getSpacedPoints(N), out = [];
    for(let i=0;i<N;i++){
      const a = pts[(i-1+N)%N], b = pts[(i+1)%N];
      const tx = b.x-a.x, ty = b.y-a.y, l = Math.hypot(tx,ty) || 1;
      out.push({ x: pts[i].x, y: pts[i].y, nx: ty/l, ny: -tx/l });
    }
    return out;
  })();
  // faces are rings shrinking from the outline to the centre: an exact smooth edge
  // (antialiased like any other geometry) plus enough inner vertices for the card to bend
  function faceGeo(isBack){
    const K = 40, n = outline.length, pos = [], nor = [], uv = [], idx = [];
    for(let k=0;k<=K;k++){
      const s = k/K;
      for(let i=0;i<n;i++){
        const x = outline[i].x*s, y = outline[i].y*s;
        pos.push(x, y, 0); nor.push(0, 0, 1); uv.push((x+W/2)/W, (y+H/2)/H);
      }
    }
    for(let k=0;k<K;k++) for(let i=0;i<n;i++){
      const j = (i+1)%n, a = k*n+i, b = (k+1)*n+i, c = (k+1)*n+j, d = k*n+j;
      idx.push(a,b,c, a,c,d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);
    if(isBack){ g.rotateY(Math.PI); g.translate(0,0,-T/2); } else g.translate(0,0,T/2);
    return g;
  }
  // the edge is a strip that follows the same rough outline
  function sideGeo(){
    // five rows from top to bottom; the outer rows lean toward the faces so the edge reads as a
    // rounded laminate lip that catches a thin line of light, not a flat wall
    const rows = [[T/2, 0.8], [T*0.3, 0.35], [0, 0], [-T*0.3, -0.35], [-T/2, -0.8]];
    const n = outline.length, RN = rows.length, pos = [], nor = [], idx = [];
    for(let i=0;i<n;i++){
      const p = outline[i];
      for(const [z, tz] of rows){
        const s = Math.sqrt(1 - tz*tz);
        pos.push(p.x, p.y, z); nor.push(p.nx*s, p.ny*s, tz);
      }
    }
    for(let i=0;i<n;i++){
      const j = (i+1)%n;
      for(let r=0;r<RN-1;r++){
        const a = i*RN+r, b = a+1, c = j*RN+r, d = c+1;
        idx.push(a,b,c, c,b,d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
    g.setIndex(idx);
    return g;
  }

  // bend: z offset = bx*X^2 + by*Y^2 + sx*X^3 + sy*Y^3 (X,Y in -1..1), normals follow the surface
  const bendU = { value: new THREE.Vector4() };
  const HX = (W/2).toFixed(4), HY = (H/2).toFixed(4);
  function addBend(m){
    m.onBeforeCompile = sh => {
      sh.uniforms.uBend = bendU;
      sh.uniforms.uPeelRepeat = peelRepeat;
      sh.fragmentShader = 'uniform vec2 uPeelRepeat;\n' + sh.fragmentShader.replace('#include <clearcoat_normal_fragment_maps>',
        THREE.ShaderChunk.clearcoat_normal_fragment_maps.replace(/clearcoatNormalMap\s*,\s*vUv\s*\)/g, 'clearcoatNormalMap, vUv * uPeelRepeat )'));
      sh.vertexShader = 'uniform vec4 uBend;\n' + sh.vertexShader
        .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
  vec2 bq = position.xy / vec2(${HX}, ${HY});
  float bdx = (2.0*uBend.x*bq.x + 3.0*uBend.z*bq.x*bq.x) / ${HX};
  float bdy = (2.0*uBend.y*bq.y + 3.0*uBend.w*bq.y*bq.y) / ${HY};
  objectNormal = vec3(objectNormal.x - bdx*objectNormal.z, objectNormal.y - bdy*objectNormal.z, objectNormal.z);`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
  transformed.z += uBend.x*bq.x*bq.x + uBend.y*bq.y*bq.y + uBend.z*bq.x*bq.x*bq.x + uBend.w*bq.y*bq.y*bq.y;`);
    };
    m.customProgramCacheKey = () => 'bend';
    return m;
  }

  const peel = orangePeel(256);
  // three r149 ignores a clearcoat map's own repeat, so the tiling is applied in the shader
  const peelRepeat = { value: new THREE.Vector2(10, 10*H/W) };

  const aniso = renderer.capabilities.getMaxAnisotropy();
  function toTex(canvas){ const t = new THREE.CanvasTexture(canvas); t.encoding = THREE.sRGBEncoding; t.anisotropy = aniso; return t; }
  function faceMat(){
    return addBend(new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.6, metalness: 0,
      emissive: 0xffffff, emissiveIntensity: 0.74,
      clearcoat: 1, clearcoatRoughness: 0.03,
      clearcoatNormalMap: peel, clearcoatNormalScale: new THREE.Vector2(0.06, 0.06),
      iridescence: 0, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 650]
    }));
  }

  const card = new THREE.Group(); scene.add(card);
  const edgeMat = addBend(new THREE.MeshPhysicalMaterial({ color: 0xf4f0e8, roughness: 0.6, clearcoat: 0.8, clearcoatRoughness: 0.12, emissive: 0xffffff, emissiveIntensity: 0.2 }));
  card.add(new THREE.Mesh(sideGeo(), edgeMat));
  const frontMat = faceMat(), backMat = faceMat();
  card.add(new THREE.Mesh(faceGeo(false), frontMat));
  card.add(new THREE.Mesh(faceGeo(true), backMat));

  // ---------- face artwork (canvas)
  const CW = 1100, CH = 1700;
  function newCanvas(){ const c = document.createElement('canvas'); c.width = CW; c.height = CH; return c; }
  function rings(ctx, bg1, bg2){
    const g = ctx.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,CH*.6);
    g.addColorStop(0,bg1); g.addColorStop(1,bg2); ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);
    ctx.strokeStyle = 'rgba(214,178,94,.16)'; ctx.lineWidth = 2;
    for(let r=20;r<CH;r+=22){ ctx.beginPath(); ctx.arc(CW/2,CH/2,r,0,Math.PI*2); ctx.stroke(); }
  }
  function drawPlaceholder(){
    const c = newCanvas(), ctx = c.getContext('2d');
    rings(ctx,'#3b2b5e','#120d22');
    ctx.strokeStyle = 'rgba(214,178,94,.8)'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(CW/2,CH/2,120,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#e8cf8e'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '300 150px sans-serif'; ctx.fillText('+',CW/2,CH/2-6);
    return c;
  }
  function drawBack(){
    const c = newCanvas(), ctx = c.getContext('2d');
    rings(ctx,'#2a2048','#100b1e');
    ctx.strokeStyle = 'rgba(214,178,94,.6)'; ctx.lineWidth = 4;
    roundRect(ctx,60,60,CW-120,CH-120,40); ctx.stroke();
    ctx.strokeStyle = 'rgba(214,178,94,.28)'; ctx.lineWidth = 3;
    roundRect(ctx,84,84,CW-168,CH-168,28); ctx.stroke();
    ctx.strokeStyle = '#d6b25e'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(CW/2,CH/2,260,0,Math.PI*2); ctx.stroke();
    return c;
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function drawCover(img){
    const c = newCanvas(), ctx = c.getContext('2d');
    const s = Math.max(CW/img.naturalWidth, CH/img.naturalHeight);
    const w = img.naturalWidth*s, h = img.naturalHeight*s;
    ctx.drawImage(img,(CW-w)/2,(CH-h)/2,w,h);
    return c;
  }
  function setFace(mat, canvas){
    const old = mat.map; const t = toTex(canvas);
    mat.map = t; mat.emissiveMap = t; mat.needsUpdate = true;
    if(old) old.dispose();
  }

  let hasFront = false, hasBack = false;
  function paintDefaults(){
    if(!hasFront) setFace(frontMat, drawPlaceholder());
    if(!hasBack) setFace(backMat, drawBack());
  }
  paintDefaults();

  function loadFile(file, which){
    if(!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      if(which === 'front'){ setFace(frontMat, drawCover(img)); hasFront = true; flipTo(Math.round(ry/360)*360); }
      else { setFace(backMat, drawCover(img)); hasBack = true; flipTo(Math.round((ry-180)/360)*360+180); }
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }
  const frontInput = document.getElementById('frontInput');
  const backInput = document.getElementById('backInput');
  frontInput.addEventListener('change', e => { loadFile(e.target.files[0],'front'); e.target.value=''; });
  backInput.addEventListener('change', e => { loadFile(e.target.files[0],'back'); e.target.value=''; });
  ['dragenter','dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('dragover'); }));
  stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0], showingBack() ? 'back' : 'front'));

  // ---------- live camera: starts on open, sits behind the card and is reflected in the gloss
  const camVideo = document.getElementById('cam');
  let camTex = null, camPlane = null, envTick = 0;
  async function startCam(){
    let stream;
    try {
      if(!window.isSecureContext || !navigator.mediaDevices) return;
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    } catch(err){ return; }
    camVideo.srcObject = stream;
    try { await camVideo.play(); } catch(e){}
    stage.classList.add('live');
    camTex = new THREE.VideoTexture(camVideo); camTex.encoding = THREE.sRGBEncoding;
    const m = new THREE.MeshBasicMaterial({ map: camTex, side: THREE.DoubleSide });
    m.color.setScalar(2.5);
    camPlane = new THREE.Mesh(new THREE.PlaneGeometry(26, 18), m);
    camPlane.position.set(0, 0, 13); camPlane.lookAt(0, 0, 0);
    env.add(camPlane);
    rebuildEnv();
  }
  startCam();

  // ---------- interaction: stays where you leave it
  const REST = { rx: 10, ry: -16 };
  let rx = REST.rx, ry = REST.ry, scale = 1, anim = null, panX = 0, panY = 0;
  const pointers = new Map(); let drag = null, pinch = null;
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const norm = a => ((a % 360) + 360) % 360;
  function showingBack(){ const f = norm(ry); return f > 90 && f < 270; }
  function flipTo(toRy, toRx){ anim = { fy: ry, ty: toRy, fx: rx, tx: toRx === undefined ? rx : toRx, t0: performance.now(), dur: reduce ? 0 : 600 }; }
  function flip(dir){ flipTo((anim ? anim.ty : ry) + 180*dir); }
  const pair = () => [...pointers.values()];

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function hitsCard(e){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc, camera);
    return ray.intersectObject(card, true).length > 0;
  }

  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    anim = null;
    if(pointers.size === 1){
      drag = { x: e.clientX, y: e.clientY, rx, ry, t: performance.now(), moved: 0, onCard: hitsCard(e) };
    } else if(pointers.size === 2){
      const [a,b] = pair();
      pinch = { d: Math.max(1, Math.hypot(a.x-b.x, a.y-b.y)), s: scale, mx: (a.x+b.x)/2, my: (a.y+b.y)/2, px: panX, py: panY }; drag = null;
    }
  });
  stage.addEventListener('pointermove', e => {
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pinch && pointers.size >= 2){
      const [a,b] = pair();
      scale = clamp(pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d, 0.5, 3.5);
      // two-finger move: the midpoint between the fingers drags the card across the screen
      const upp = 2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) / stage.clientHeight;
      panX = pinch.px + ((a.x+b.x)/2 - pinch.mx)*upp;
      panY = pinch.py - ((a.y+b.y)/2 - pinch.my)*upp;
      return;
    }
    if(drag){
      const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
      drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
      ry = drag.ry + dx*0.5;
      rx = clamp(drag.rx + dy*0.35, -75, 75);
    }
  });
  function up(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if(pinch){
      if(pointers.size < 2){ pinch = null; if(pointers.size === 1){ const [p] = pair(); drag = { x:p.x, y:p.y, rx, ry, t:0, moved:99, onCard:false }; } }
      return;
    }
    if(drag && pointers.size === 0){
      const held = performance.now() - drag.t;
      if(drag.onCard && drag.moved < 6){
        if(held >= 550) (showingBack() ? backInput : frontInput).click();
        else if(held < 260){ if(!hasFront && !showingBack()) frontInput.click(); else flip(1); }
      }
      drag = null;
    }
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); scale = clamp(scale*Math.exp(-e.deltaY*0.0015), 0.5, 3.5); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  renderer.domElement.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); flip(1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); flip(-1); }
    if(e.key === '+' || e.key === '=') scale = clamp(scale*1.15, 0.5, 3.5);
    if(e.key === '-') scale = clamp(scale/1.15, 0.5, 3.5);
  });

  // ---------- sizing + loop
  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    camera.position.set(0, 0, Math.max((H*1.22/2)/tan, (W*1.35/2)/(tan*camera.aspect)));
    camera.lookAt(0,0,0);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  const D = THREE.MathUtils.degToRad;

  // ---------- flex physics: gravity sags the card, fast turns make it lag and wobble
  const G = new THREE.Vector3(0, -0.35, -1).normalize(); // looking down at the card, like on a table
  const K = 220, C = 11, SAG = 0.075, LAG = 0.05;
  const bb = [0,0,0,0], bv = [0,0,0,0];
  const qInv = new THREE.Quaternion(), gL = new THREE.Vector3();
  let lastT = performance.now(), prx = rx, pry = ry, wx = 0, wy = 0;
  function physics(){
    const now = performance.now();
    const dt = Math.min(0.033, Math.max(0.001, (now-lastT)/1000)); lastT = now;
    const owx = wx, owy = wy;
    wx += (D(rx-prx)/dt - wx)*0.3; wy += (D(ry-pry)/dt - wy)*0.3;
    prx = rx; pry = ry;
    const ax = reduce ? 0 : clamp((wx-owx)/dt, -2500, 2500);
    const ay = reduce ? 0 : clamp((wy-owy)/dt, -2500, 2500);
    qInv.copy(card.quaternion).invert(); gL.copy(G).applyQuaternion(qInv);
    const F = [K*gL.z*SAG*0.3, K*gL.z*SAG, ay*LAG, -ax*LAG];
    for(let i=0;i<4;i++){
      bv[i] += (F[i] - K*bb[i] - C*bv[i])*dt;
      bb[i] += bv[i]*dt;
    }
    bendU.value.set(bb[0], bb[1], bb[2], bb[3]);
  }

  function frame(){
    if(anim){
      const p = anim.dur ? clamp((performance.now()-anim.t0)/anim.dur, 0, 1) : 1;
      const k = 1 - Math.pow(1-p, 3);
      ry = anim.fy + (anim.ty-anim.fy)*k; rx = anim.fx + (anim.tx-anim.fx)*k;
      if(p >= 1) anim = null;
    }
    card.rotation.set(D(rx), D(ry), 0, 'XYZ');
    card.scale.setScalar(scale);
    card.position.set(panX, panY, 0);
    physics();
    if(camTex && (++envTick % 6 === 0)) rebuildEnv();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
