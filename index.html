<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>와 이거 진짜 같다</title>
<style>
html,body{margin:0;height:100%;background:#2c4019;overflow:hidden}
.stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#lawn{position:absolute;top:-40px;left:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(10px) saturate(1.05);pointer-events:none}
.stage.live #lawn,.stage.photo #lawn{display:none}
#bgPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}
.stage.photo #bgPhoto{display:block}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;pointer-events:none}
.stage.live video{display:block}
.stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.consent{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.consent[hidden]{display:none}
.sheet{width:100%;max-width:380px;border-radius:22px;padding:22px 20px 16px;background:rgba(28,30,24,.9);color:#f4efe6;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.sheet .t{margin:0 0 8px;font-size:1.05rem;font-weight:700}
.sheet .d{margin:0 0 18px;font-size:.92rem;line-height:1.55;color:#d9d2c4;word-break:keep-all}
.sheet .b{display:grid;gap:8px}
.sheet button{flex:1;min-height:46px;border-radius:14px;border:0;font:inherit;font-weight:600;font-size:.95rem;cursor:pointer}
.sheet .no{background:rgba(255,255,255,.1);color:#f4efe6}
.sheet .yes{background:#f4efe6;color:#1c1e18}
.sheet button:focus-visible{outline:2px solid #f4efe6;outline-offset:2px}
@keyframes flash{from{opacity:.85}to{opacity:0}}
.shutter{position:fixed;z-index:5;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:68px;height:68px;margin-left:-34px;
  border-radius:50%;border:4px solid rgba(255,255,255,.95);background:transparent;padding:5px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 2px 12px rgba(0,0,0,.25)}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.95);transition:transform .12s}
.shutter:active span{transform:scale(.88)}
.shutter:focus-visible{outline:2px solid #fff;outline-offset:4px}
.flash{position:fixed;inset:0;z-index:20;background:#fff;pointer-events:none;animation:flash .35s ease-out forwards}
</style>
</head>
<body>
<main class="stage" id="stage"><canvas id="lawn" aria-hidden="true"></canvas><img id="bgPhoto" alt=""><video id="cam" playsinline muted></video></main>

<div class="consent" id="consent" role="dialog" aria-modal="true" aria-labelledby="consentT" hidden>
  <div class="sheet">
    <p class="t" id="consentT"></p>
    <p class="d" id="consentD"></p>
    <div class="b"><button class="yes" id="photoYes" type="button">사진 고르기</button><button class="no" id="camYes" type="button">카메라 켜기</button><button class="no" id="camNo" type="button"></button></div>
  </div>
</div>

<button class="shutter" id="shutter" type="button" aria-label="사진 찍기"><span></span></button>
<input type="file" id="frontInput" accept="image/*" aria-label="앞면 사진">
<input type="file" id="backInput" accept="image/*" aria-label="뒷면 사진">
<input type="file" id="bgInput" accept="image/*" aria-label="배경 사진">

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" integrity="sha384-RRHfJ6w1mTlKUBMYT/hvnRiOzEB/vyRV3DrQOseb6oYfvaZSfdd0byS4bHps0k2R" crossorigin="anonymous"></script>
<script>
(function(){
  const stage = document.getElementById('stage');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch(e){
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.physicallyCorrectLights = true;
  renderer.domElement.className = 'gl';
  renderer.domElement.tabIndex = 0;
  renderer.domElement.setAttribute('role', 'button');
  renderer.domElement.setAttribute('aria-label', '포토카드. 드래그로 기울이고 탭하거나 Enter로 뒤집기');
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);

  // ---------- studio environment: one large softbox in a warm dark room
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  const basic = (r,g,b) => new THREE.MeshBasicMaterial({ color: new THREE.Color(r,g,b), side: THREE.DoubleSide });
  const room = new THREE.Mesh(new THREE.BoxGeometry(30,30,30), basic(0.03,0.018,0.012));
  room.material.side = THREE.BackSide; env.add(room);
  const softbox = new THREE.Mesh(new THREE.CircleGeometry(0.36, 64), basic(260,248,225));
  softbox.position.set(-2.2, 2.6, 7.5); softbox.lookAt(0,0,0); env.add(softbox);
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(9,6.5), basic(0.22,0.21,0.2));
  halo.position.copy(softbox.position).multiplyScalar(1.03); halo.lookAt(0,0,0); env.add(halo);
  const table = new THREE.Mesh(new THREE.PlaneGeometry(30,30), basic(0.32,0.18,0.1));
  table.position.set(0,-7,0); table.rotation.x = -Math.PI/2; env.add(table);
  const fill = new THREE.Mesh(new THREE.PlaneGeometry(5,5), basic(0.18,0.18,0.2));
  fill.position.set(7,-1,3); fill.lookAt(0,0,0); env.add(fill);
  let envRT = null;
  function rebuildEnv(){
    const rt = pmrem.fromScene(env, 0.015);
    scene.environment = rt.texture;
    if(envRT) envRT.dispose();
    envRT = rt;
  }
  // ---------- default background: a blurred lawn, drawn here (no photo, no copyright)
  function drawLawn(c){
    const w = c.width = 720, h = c.height = 1280, ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#8aa556'); g.addColorStop(0.35,'#5d7f32'); g.addColorStop(1,'#25401a');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    const blades = [];
    for(let i=0;i<14000;i++) blades.push({ x: Math.random()*w, y: Math.random()*h*1.05 });
    blades.sort((a,b) => a.y-b.y);
    ctx.lineCap = 'round';
    for(const b of blades){
      const near = b.y/h, len = 6 + near*46, lean = (Math.random()-0.5)*len*0.7;
      const hue = 72 + Math.random()*32, light = 18 + Math.random()*22 + (1-near)*16;
      ctx.strokeStyle = `hsl(${hue},${42+Math.random()*20}%,${light}%)`;
      ctx.lineWidth = 0.6 + near*2.4*Math.random() + 0.4;
      ctx.beginPath(); ctx.moveTo(b.x, b.y);
      ctx.quadraticCurveTo(b.x + lean*0.3, b.y - len*0.6, b.x + lean, b.y - len); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<26;i++){
      const x = Math.random()*w, y = Math.random()*h*0.55, r = 30 + Math.random()*90;
      const rg = ctx.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0,'rgba(255,246,200,.16)'); rg.addColorStop(1,'rgba(255,246,200,0)');
      ctx.fillStyle = rg; ctx.fillRect(x-r,y-r,2*r,2*r);
    }
    ctx.globalCompositeOperation = 'source-over';
    return c;
  }
  const lawnCanvas = drawLawn(document.getElementById('lawn'));
  const lawnTex = new THREE.CanvasTexture(lawnCanvas); lawnTex.encoding = THREE.sRGBEncoding;
  // whatever is behind the card (lawn, or the live camera) is also what the gloss faintly reflects
  const reflMat = new THREE.MeshBasicMaterial({ map: lawnTex, side: THREE.DoubleSide });
  // the backdrop also lights the card, so its brightness is evened out: a sunny photo and a dim
  // room both light the card about as much as the lawn does, instead of a bright photo blowing it out
  const lumCanvas = document.createElement('canvas'); lumCanvas.width = lumCanvas.height = 16;
  const lumCtx = lumCanvas.getContext('2d', { willReadFrequently: true });
  const toLin = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); };
  function meanLinear(src){
    try { lumCtx.drawImage(src, 0, 0, 16, 16); } catch(e){ return 0.12; }
    const d = lumCtx.getImageData(0, 0, 16, 16).data; let sum = 0;
    for(let i=0;i<d.length;i+=4) sum += 0.2126*toLin(d[i]) + 0.7152*toLin(d[i+1]) + 0.0722*toLin(d[i+2]);
    return Math.max(0.005, sum/(d.length/4));
  }
  const REFL_TARGET = 0.26;
  function normalizeRefl(src){ reflMat.color.setScalar(Math.min(2.5, Math.max(0.15, REFL_TARGET/meanLinear(src)))); }
  normalizeRefl(lawnCanvas);
  const reflPlane = new THREE.Mesh(new THREE.PlaneGeometry(26, 18), reflMat);
  reflPlane.position.set(0, 0, 13); reflPlane.lookAt(0, 0, 0); env.add(reflPlane);
  rebuildEnv();

  // ---------- orange-peel laminate normal map (tileable)
  function orangePeel(n){
    let a = new Float32Array(n*n), t = new Float32Array(n*n);
    for(let i=0;i<a.length;i++) a[i] = Math.random();
    const r = 2, d = 2*r+1;
    for(let pass=0; pass<4; pass++){
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let s=0; for(let k=-r;k<=r;k++) s+=a[y*n+((x+k+n)%n)]; t[y*n+x]=s/d; }
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){ let s=0; for(let k=-r;k<=r;k++) s+=t[((y+k+n)%n)*n+x]; a[y*n+x]=s/d; }
    }
    let mn=Infinity,mx=-Infinity; for(const v of a){ if(v<mn)mn=v; if(v>mx)mx=v; }
    const c = document.createElement('canvas'); c.width=c.height=n;
    const ctx = c.getContext('2d'), img = ctx.createImageData(n,n), S = 2.5;
    const h = (x,y) => (a[((y+n)%n)*n+((x+n)%n)]-mn)/(mx-mn);
    for(let y=0;y<n;y++) for(let x=0;x<n;x++){
      const dx=(h(x+1,y)-h(x-1,y))*S, dy=(h(x,y+1)-h(x,y-1))*S;
      const l=Math.hypot(dx,dy,1), i=(y*n+x)*4;
      img.data[i]=(-dx/l*.5+.5)*255; img.data[i+1]=(dy/l*.5+.5)*255; img.data[i+2]=(1/l*.5+.5)*255; img.data[i+3]=255;
    }
    ctx.putImageData(img,0,0);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return tex;
  }

  // ---------- card geometry (55 x 85 mm, rounded corners, real thickness)
  const W = 2.2, H = 3.4, T = 0.012, R = 0.22;
  const shape = new THREE.Shape(); const x0=-W/2, y0=-H/2;
  shape.moveTo(x0+R,y0); shape.lineTo(x0+W-R,y0); shape.absarc(x0+W-R,y0+R,R,-Math.PI/2,0,false);
  shape.lineTo(x0+W,y0+H-R); shape.absarc(x0+W-R,y0+H-R,R,0,Math.PI/2,false);
  shape.lineTo(x0+R,y0+H); shape.absarc(x0+R,y0+H-R,R,Math.PI/2,Math.PI,false);
  shape.lineTo(x0,y0+R); shape.absarc(x0+R,y0+R,R,Math.PI,1.5*Math.PI,false);

  // clean outline of the rounded rectangle (points with outward normals)
  const outline = (() => {
    const N = 480, pts = shape.getSpacedPoints(N), out = [];
    for(let i=0;i<N;i++){
      const a = pts[(i-1+N)%N], b = pts[(i+1)%N];
      const tx = b.x-a.x, ty = b.y-a.y, l = Math.hypot(tx,ty) || 1;
      out.push({ x: pts[i].x, y: pts[i].y, nx: ty/l, ny: -tx/l });
    }
    return out;
  })();
  // faces are rings shrinking from the outline to the centre: an exact smooth edge
  // (antialiased like any other geometry) plus enough inner vertices for the card to bend
  function faceGeo(isBack){
    const K = 40, n = outline.length, pos = [], nor = [], uv = [], idx = [];
    for(let k=0;k<=K;k++){
      const s = k/K;
      for(let i=0;i<n;i++){
        const x = outline[i].x*s, y = outline[i].y*s;
        pos.push(x, y, 0); nor.push(0, 0, 1); uv.push((x+W/2)/W, (y+H/2)/H);
      }
    }
    for(let k=0;k<K;k++) for(let i=0;i<n;i++){
      const j = (i+1)%n, a = k*n+i, b = (k+1)*n+i, c = (k+1)*n+j, d = k*n+j;
      idx.push(a,b,c, a,c,d);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);
    if(isBack){ g.rotateY(Math.PI); g.translate(0,0,-T/2); } else g.translate(0,0,T/2);
    return g;
  }
  // the edge is a strip that follows the same rough outline
  function sideGeo(){
    // five rows from top to bottom; the outer rows lean toward the faces so the edge reads as a
    // rounded laminate lip that catches a thin line of light, not a flat wall
    const rows = [[T/2, 0.8], [T*0.3, 0.35], [0, 0], [-T*0.3, -0.35], [-T/2, -0.8]];
    const n = outline.length, RN = rows.length, pos = [], nor = [], idx = [];
    for(let i=0;i<n;i++){
      const p = outline[i];
      for(const [z, tz] of rows){
        const s = Math.sqrt(1 - tz*tz);
        pos.push(p.x, p.y, z); nor.push(p.nx*s, p.ny*s, tz);
      }
    }
    for(let i=0;i<n;i++){
      const j = (i+1)%n;
      for(let r=0;r<RN-1;r++){
        const a = i*RN+r, b = a+1, c = j*RN+r, d = c+1;
        idx.push(a,b,c, c,b,d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor,3));
    g.setIndex(idx);
    return g;
  }

  // bend: z offset = bx*X^2 + by*Y^2 + sx*X^3 + sy*Y^3 (X,Y in -1..1), normals follow the surface
  const bendU = { value: new THREE.Vector4() };
  const HX = (W/2).toFixed(4), HY = (H/2).toFixed(4);
  function addBend(m){
    m.onBeforeCompile = sh => {
      sh.uniforms.uBend = bendU;
      sh.uniforms.uPeelRepeat = peelRepeat;
      sh.fragmentShader = 'uniform vec2 uPeelRepeat;\n' + sh.fragmentShader.replace('#include <clearcoat_normal_fragment_maps>',
        THREE.ShaderChunk.clearcoat_normal_fragment_maps.replace(/clearcoatNormalMap\s*,\s*vUv\s*\)/g, 'clearcoatNormalMap, vUv * uPeelRepeat )'));
      sh.vertexShader = 'uniform vec4 uBend;\n' + sh.vertexShader
        .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
  vec2 bq = position.xy / vec2(${HX}, ${HY});
  float bdx = (2.0*uBend.x*bq.x + 3.0*uBend.z*bq.x*bq.x) / ${HX};
  float bdy = (2.0*uBend.y*bq.y + 3.0*uBend.w*bq.y*bq.y) / ${HY};
  objectNormal = vec3(objectNormal.x - bdx*objectNormal.z, objectNormal.y - bdy*objectNormal.z, objectNormal.z);`)
        .replace('#include <begin_vertex>', `#include <begin_vertex>
  transformed.z += uBend.x*bq.x*bq.x + uBend.y*bq.y*bq.y + uBend.z*bq.x*bq.x*bq.x + uBend.w*bq.y*bq.y*bq.y;`);
    };
    m.customProgramCacheKey = () => 'bend';
    return m;
  }

  const peel = orangePeel(256);
  // three r149 ignores a clearcoat map's own repeat, so the tiling is applied in the shader
  const peelRepeat = { value: new THREE.Vector2(10, 10*H/W) };

  const aniso = renderer.capabilities.getMaxAnisotropy();
  function toTex(canvas){ const t = new THREE.CanvasTexture(canvas); t.encoding = THREE.sRGBEncoding; t.anisotropy = aniso; return t; }
  function faceMat(){
    return addBend(new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.6, metalness: 0,
      emissive: 0xffffff, emissiveIntensity: 0.38,  // leaves headroom so whites shade instead of clipping
      clearcoat: 1, clearcoatRoughness: 0.03,
      clearcoatNormalMap: peel, clearcoatNormalScale: new THREE.Vector2(0.06, 0.06),
      iridescence: 0, iridescenceIOR: 1.35, iridescenceThicknessRange: [180, 650]
    }));
  }

  const card = new THREE.Group(); scene.add(card);
  const edgeMat = addBend(new THREE.MeshPhysicalMaterial({ color: 0xf4f0e8, roughness: 0.6, clearcoat: 0.8, clearcoatRoughness: 0.12, emissive: 0xffffff, emissiveIntensity: 0.2 }));
  card.add(new THREE.Mesh(sideGeo(), edgeMat));
  const frontMat = faceMat(), backMat = faceMat();
  card.add(new THREE.Mesh(faceGeo(false), frontMat));
  card.add(new THREE.Mesh(faceGeo(true), backMat));


  // ---------- face artwork (canvas)
  const CW = 1100, CH = 1700;
  function newCanvas(){ const c = document.createElement('canvas'); c.width = CW; c.height = CH; return c; }
  // empty face: plain paper (soft mottling, fibres, fine grain) with a thin plus in the middle
  function drawPaper(){
    const c = newCanvas(), ctx = c.getContext('2d');
    ctx.fillStyle = '#f1ede4'; ctx.fillRect(0,0,CW,CH);
    for(let i=0;i<260;i++){
      const x = Math.random()*CW, y = Math.random()*CH, r = 40 + Math.random()*180;
      const dark = Math.random() < 0.5;
      const rg = ctx.createRadialGradient(x,y,0,x,y,r);
      rg.addColorStop(0, dark ? 'rgba(150,130,100,.05)' : 'rgba(255,255,250,.07)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg; ctx.fillRect(x-r,y-r,2*r,2*r);
    }
    ctx.lineCap = 'round';
    for(let i=0;i<2600;i++){
      const x = Math.random()*CW, y = Math.random()*CH, a = Math.random()*Math.PI, l = 4 + Math.random()*16;
      ctx.strokeStyle = `rgba(${110+Math.random()*40},${95+Math.random()*30},${70+Math.random()*25},${0.04+Math.random()*0.08})`;
      ctx.lineWidth = 0.6 + Math.random()*0.9;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); ctx.stroke();
    }
    const img = ctx.getImageData(0,0,CW,CH), d = img.data;
    for(let i=0;i<d.length;i+=4){ const n = (Math.random()-0.5)*10; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
    ctx.putImageData(img,0,0);
    ctx.strokeStyle = 'rgba(95,84,68,.55)'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.moveTo(CW/2-70,CH/2); ctx.lineTo(CW/2+70,CH/2); ctx.moveTo(CW/2,CH/2-70); ctx.lineTo(CW/2,CH/2+70); ctx.stroke();
    return c;
  }
  function drawCover(img){
    const c = newCanvas(), ctx = c.getContext('2d');
    const s = Math.max(CW/img.naturalWidth, CH/img.naturalHeight);
    const w = img.naturalWidth*s, h = img.naturalHeight*s;
    ctx.drawImage(img,(CW-w)/2,(CH-h)/2,w,h);
    return c;
  }
  function setFace(mat, canvas){
    const old = mat.map; const t = toTex(canvas);
    mat.map = t; mat.emissiveMap = t; mat.needsUpdate = true;
    if(old) old.dispose();
  }

  let hasFront = false, hasBack = false;
  function paintDefaults(){
    if(!hasFront) setFace(frontMat, drawPaper());
    if(!hasBack) setFace(backMat, drawPaper());
  }
  paintDefaults();

  function loadFile(file, which){
    if(!file || !file.type.startsWith('image/')) return;
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      if(which === 'front'){ setFace(frontMat, drawCover(img)); hasFront = true; if(showingBack()) flip(1); }
      else { setFace(backMat, drawCover(img)); hasBack = true; if(!showingBack()) flip(1); }
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }
  const frontInput = document.getElementById('frontInput');
  const backInput = document.getElementById('backInput');
  frontInput.addEventListener('change', e => { loadFile(e.target.files[0],'front'); e.target.value=''; });
  backInput.addEventListener('change', e => { loadFile(e.target.files[0],'back'); e.target.value=''; });
  ['dragenter','dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('dragover'); }));
  stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0], showingBack() ? 'back' : 'front'));

  // ---------- camera: tap the background, read the note, then the browser asks for permission
  const camVideo = document.getElementById('cam');
  const consent = document.getElementById('consent'), consentT = document.getElementById('consentT'), consentD = document.getElementById('consentD');
  const camYes = document.getElementById('camYes'), camNo = document.getElementById('camNo');
  let camTex = null, envTick = 0;
  function openConsent(){
    consentT.textContent = '배경 바꾸기';
    consentD.textContent = '고른 사진이나 카메라 화면은 어디에도 전송되거나 저장되지 않아요. 이 브라우저 안에서만 보이고, 창을 닫으면 사라져요.';
    camYes.hidden = false; photoYes.hidden = false; camNo.textContent = '취소';
    consent.hidden = false; photoYes.focus();
  }
  function consentError(text){
    consentT.textContent = '카메라를 켤 수 없어요';
    consentD.textContent = text;
    camYes.hidden = true; camNo.textContent = '닫기'; photoYes.focus();
  }
  camNo.addEventListener('click', () => { consent.hidden = true; });

  // photo background: shown behind the card and faintly reflected in the gloss, like the camera
  const photoYes = document.getElementById('photoYes'), bgInput = document.getElementById('bgInput');
  const bgPhoto = document.getElementById('bgPhoto');
  let photoTex = null;
  function stopCam(){
    if(camVideo.srcObject){ camVideo.srcObject.getTracks().forEach(t => t.stop()); camVideo.srcObject = null; }
    if(camTex){ camTex.dispose(); camTex = null; }
    stage.classList.remove('live');
  }
  function clearPhoto(){
    if(photoTex){ photoTex.dispose(); photoTex = null; }
    if(bgPhoto.dataset.url){ URL.revokeObjectURL(bgPhoto.dataset.url); delete bgPhoto.dataset.url; }
    bgPhoto.removeAttribute('src'); stage.classList.remove('photo');
  }
  photoYes.addEventListener('click', () => { consent.hidden = true; bgInput.click(); });
  bgInput.addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if(!f || !f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => usePhotoBg(img, url, true);
    img.src = url;
  });
  function usePhotoBg(img, src, ownUrl){
    stopCam(); clearPhoto();
    if(ownUrl) bgPhoto.dataset.url = src;
    bgPhoto.src = src; stage.classList.add('photo');
    photoTex = new THREE.Texture(img); photoTex.encoding = THREE.sRGBEncoding; photoTex.needsUpdate = true;
    reflMat.map = photoTex; reflMat.needsUpdate = true; normalizeRefl(img);
    rebuildEnv();
  }
  // default backdrop: a photo shipped with the site (the drawn lawn stays as the fallback)
  const DEFAULT_BG = 'bg.jpg';
  (() => {
    const img = new Image();
    img.onload = () => { if(!stage.classList.contains('live') && !stage.classList.contains('photo')) usePhotoBg(img, DEFAULT_BG, false); };
    img.src = DEFAULT_BG;
  })();
  camYes.addEventListener('click', async () => {
    if(window.self !== window.top){
      consentError('이 미리보기 화면에서는 카메라가 막혀 있어요. 배포한 주소(Vercel)에서 열면 켜져요.'); return;
    }
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      consentError('카메라는 https 주소로 연 페이지에서만 쓸 수 있어요.'); return;
    }
    let stream;
    try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
    } catch(err){
      consentError(err && err.name === 'NotAllowedError'
        ? '카메라 권한이 거부됐어요. Safari 주소창 왼쪽 메뉴의 웹사이트 설정에서 카메라를 허용한 뒤 새로고침해 주세요.'
        : '이 기기에서 카메라를 찾을 수 없어요.');
      return;
    }
    consent.hidden = true;
    stopCam(); clearPhoto();
    camVideo.srcObject = stream;
    try { await camVideo.play(); } catch(e){}
    stage.classList.add('live');
    camTex = new THREE.VideoTexture(camVideo); camTex.encoding = THREE.sRGBEncoding;
    reflMat.map = camTex; reflMat.needsUpdate = true; normalizeRefl(camVideo);
    rebuildEnv();
  });

  // ---------- interaction: stays where you leave it
  // orientation lives in one quaternion and every gesture turns it around the screen's axes,
  // so dragging and twisting move the same way whichever side of the card faces you
  const D = THREE.MathUtils.degToRad;
  const Q = new THREE.Quaternion().setFromEuler(new THREE.Euler(D(10), D(-16), 0, 'XYZ'));
  const AX = new THREE.Vector3(1,0,0), AY = new THREE.Vector3(0,1,0), AZ = new THREE.Vector3(0,0,1);
  const tq = new THREE.Quaternion(), tv = new THREE.Vector3();
  function turn(axis, deg){ tq.setFromAxisAngle(axis, D(deg)); Q.premultiply(tq).normalize(); }
  let scale = 1, anim = null, panX = 0, panY = 0;
  const pointers = new Map(); let drag = null, pinch = null;
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  function showingBack(){ return tv.set(0,0,1).applyQuaternion(Q).z < 0; }
  function flip(dir){
    if(anim) Q.copy(anim.end);
    const q0 = Q.clone(), end = new THREE.Quaternion().setFromAxisAngle(AY, Math.PI*dir).multiply(q0);
    anim = { q0, end, dir, t0: performance.now(), dur: reduce ? 0 : 600 };
  }
  const pair = () => [...pointers.values()];

  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function hitsCard(e){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObject(card, true).filter(h => h.object.visible && h.object.parent.visible);
    return hits.length ? hits[0].object : null;
  }

  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    anim = null;
    if(pointers.size === 1){
      const hit = hitsCard(e);
      drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: 0, onCard: !!hit };
    } else if(pointers.size === 2){
      const [a,b] = pair();
      pinch = { d: Math.max(1, Math.hypot(a.x-b.x, a.y-b.y)), s: scale, mx: (a.x+b.x)/2, my: (a.y+b.y)/2, px: panX, py: panY, ang: Math.atan2(b.y-a.y, b.x-a.x) }; drag = null;
    }
  });
  stage.addEventListener('pointermove', e => {
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(pinch && pointers.size >= 2){
      const [a,b] = pair();
      scale = clamp(pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / pinch.d, 0.5, 3.5);
      // two-finger move: the midpoint between the fingers drags the card across the screen
      const upp = 2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) / stage.clientHeight;
      panX = pinch.px + ((a.x+b.x)/2 - pinch.mx)*upp;
      panY = pinch.py - ((a.y+b.y)/2 - pinch.my)*upp;
      // two-finger twist: turning the fingers spins the card in its own plane
      const ang = Math.atan2(b.y-a.y, b.x-a.x);
      let da = ang - pinch.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      pinch.ang = ang; turn(AZ, -da*180/Math.PI);
      return;
    }
    if(drag){
      const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
      drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
      turn(AY, (e.clientX-drag.lx)*0.5);
      turn(AX, (e.clientY-drag.ly)*0.35);
      drag.lx = e.clientX; drag.ly = e.clientY;
    }
  });
  function up(e){
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if(pinch){
      if(pointers.size < 2){ pinch = null; if(pointers.size === 1){ const [p] = pair(); drag = { x:p.x, y:p.y, lx:p.x, ly:p.y, t:0, moved:99, onCard:false }; } }
      return;
    }
    if(drag && pointers.size === 0){
      const held = performance.now() - drag.t;
      if(drag.moved < 6){
        if(drag.onCard){
          const back = showingBack(), input = back ? backInput : frontInput, filled = back ? hasBack : hasFront;
          if(held >= 550) input.click();
          else if(held < 260){ if(!filled) input.click(); else flip(1); }
        } else if(held < 400){
          openConsent();
        }
      }
      drag = null;
    }
  }
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); scale = clamp(scale*Math.exp(-e.deltaY*0.0015), 0.5, 3.5); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  renderer.domElement.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); flip(1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); flip(-1); }
    if(e.key === '+' || e.key === '=') scale = clamp(scale*1.15, 0.5, 3.5);
    if(e.key === '-') scale = clamp(scale/1.15, 0.5, 3.5);
  });

  // ---------- shutter: background + card, composed into one image at screen resolution
  const shutter = document.getElementById('shutter');
  function drawCoverTo(ctx, src, sw, sh, w, h){
    const k = Math.max(w/sw, h/sh), dw = sw*k, dh = sh*k;
    ctx.drawImage(src, (w-dw)/2, (h-dh)/2, dw, dh);
  }
  function capture(){
    const gl = renderer.domElement, w = gl.width, h = gl.height;
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const ctx = out.getContext('2d');
    if(stage.classList.contains('live') && camVideo.videoWidth){
      drawCoverTo(ctx, camVideo, camVideo.videoWidth, camVideo.videoHeight, w, h);
    } else if(stage.classList.contains('photo') && bgPhoto.naturalWidth){
      drawCoverTo(ctx, bgPhoto, bgPhoto.naturalWidth, bgPhoto.naturalHeight, w, h);
    } else {
      // the lawn is blurred on screen with CSS; shrink-then-stretch gives the same soft look
      const small = document.createElement('canvas'); small.width = Math.max(8, Math.round(w/14)); small.height = Math.max(8, Math.round(h/14));
      const sctx = small.getContext('2d'); sctx.imageSmoothingQuality = 'high';
      drawCoverTo(sctx, lawnCanvas, lawnCanvas.width, lawnCanvas.height, small.width, small.height);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(small, -w*0.03, -h*0.03, w*1.06, h*1.06);
    }
    renderer.render(scene, camera);           // draw the card now so the frame is still there to copy
    ctx.drawImage(gl, 0, 0, w, h);
    return new Promise(res => out.toBlob(res, 'image/jpeg', 0.93));
  }
  function stamp(){
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }
  async function saveShot(blob){
    const filename = `photocard-${stamp()}.jpg`;
    // inside Claude: the page asks the viewer to save; on your own site: share sheet, then plain download
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if(dl){ try { await dl.save({ filename, data: blob }); } catch(e){} return; }
    const file = new File([blob], filename, { type: 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file] }); return; } catch(e){ if(e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  shutter.addEventListener('click', async () => {
    const blob = await capture();
    const f = document.createElement('div'); f.className = 'flash'; document.body.appendChild(f);
    setTimeout(() => f.remove(), 400);
    if(blob) saveShot(blob);
  });

  // ---------- sizing + loop
  function resize(){
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    const fh = H*1.22, fw = W*1.35;
    camera.position.set(0, 0, Math.max((fh/2)/tan, (fw/2)/(tan*camera.aspect)));
    camera.lookAt(0,0,0);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  // ---------- flex physics: gravity sags the card, fast turns make it lag and wobble
  const G = new THREE.Vector3(0, -0.35, -1).normalize(); // looking down at the card, like on a table
  const K = 220, C = 11, SAG = 0.075, LAG = 0.05;
  const bb = [0,0,0,0], bv = [0,0,0,0];
  const qInv = new THREE.Quaternion(), gL = new THREE.Vector3();
  let lastT = performance.now(), wx = 0, wy = 0;
  const prevQ = Q.clone(), dq = new THREE.Quaternion(), wv = new THREE.Vector3();
  function physics(){
    const now = performance.now();
    const dt = Math.min(0.033, Math.max(0.001, (now-lastT)/1000)); lastT = now;
    const owx = wx, owy = wy;
    // spin rate in the card's own frame, from how far its orientation moved since last frame
    dq.copy(prevQ).invert().multiply(card.quaternion);
    if(dq.w < 0){ dq.x = -dq.x; dq.y = -dq.y; dq.z = -dq.z; dq.w = -dq.w; }
    const turned = 2*Math.acos(Math.min(1, dq.w)), sn = Math.sqrt(Math.max(0, 1 - dq.w*dq.w));
    if(sn > 1e-6) wv.set(dq.x, dq.y, dq.z).multiplyScalar(turned/sn/dt); else wv.set(0,0,0);
    prevQ.copy(card.quaternion);
    wx += (wv.x - wx)*0.3; wy += (wv.y - wy)*0.3;
    const ax = reduce ? 0 : clamp((wx-owx)/dt, -2500, 2500);
    const ay = reduce ? 0 : clamp((wy-owy)/dt, -2500, 2500);
    qInv.copy(card.quaternion).invert(); gL.copy(G).applyQuaternion(qInv);
    const sag = SAG;
    const F = [K*gL.z*sag*0.3, K*gL.z*sag, ay*LAG, -ax*LAG];
    for(let i=0;i<4;i++){
      bv[i] += (F[i] - K*bb[i] - C*bv[i])*dt;
      bb[i] += bv[i]*dt;
    }
    bendU.value.set(bb[0], bb[1], bb[2], bb[3]);
  }

  function frame(){
    if(anim){
      const p = anim.dur ? clamp((performance.now()-anim.t0)/anim.dur, 0, 1) : 1;
      const k = 1 - Math.pow(1-p, 3);
      tq.setFromAxisAngle(AY, Math.PI*anim.dir*k); Q.copy(tq).multiply(anim.q0);
      if(p >= 1){ Q.copy(anim.end); anim = null; }
    }
    card.quaternion.copy(Q);
    card.scale.setScalar(scale);
    card.position.set(panX, panY, 0);
    physics();
    if(camTex && (++envTick % 6 === 0)){ normalizeRefl(camVideo); rebuildEnv(); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
